[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dayahead"
version = "0.2.0"
description = "Parseo y transformación de precios day-ahead (ENTSO-E, SMARD, PSE, BCE). Módulo puro, sin I/O."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dayahead*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
